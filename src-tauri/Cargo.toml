[package]
name = "multizone"
version = "0.17.3"
description = "MultiZone — LLM interface"
authors = ["MultiZone"]
edition = "2021"
# Bumped from 1.77 for wreq (browser-impersonating HTTP client) which requires 1.85.
rust-version = "1.85"

[lib]
name = "multizone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

# ─── Shared by both shapes ───────────────────────────────────────────────────
#
# The crate builds two things (see src/lib.rs): the whole app on a desktop, and
# a WebView shell on a phone. Only what the shell genuinely needs lives here —
# everything else is under the target section below, so an Android build does
# not compile SQLite, BoringSSL, an OCR engine and an audio stack in order to
# host a web view.
[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
# Mobile too: the moment a run stops for an approval is exactly the moment the
# phone is in a pocket.
tauri-plugin-notification = "2.3.3"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── Desktop only ────────────────────────────────────────────────────────────
#
# `cfg(desktop)` is Tauri's, and cargo does not know it — so the split has to be
# stated in the target's own terms. Keep this in step with the `#[cfg(desktop)]`
# module list in src/lib.rs: a dependency left above that only the desktop uses
# is minutes of Android build time for nothing, and one moved down here that
# mobile needs is a link error.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tokio = { version = "1.41", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"

axum = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
# `ServiceExt::oneshot`, so the `app_control` tool can serve a request through
# the same axum router the socket does instead of re-implementing the surface.
# Already in the tree under axum; this only makes it a direct dependency.
tower = { version = "0.5", features = ["util"] }

reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls"], default-features = false }
eventsource-stream = "0.2"

sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
# Same hash sqlx uses for migration checksums. Needed to recognise (and repair)
# databases whose stored checksums differ from ours only by line endings — see
# `db::repair_line_ending_checksums`. Already in the tree via sqlx.
sha2 = "0.10"

uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Every decoder is kept, because attachments are arbitrary user-supplied images
# — the only things dropped from the default feature set are `avif` and `exr`.
# `avif` is the AVIF *encoder* (ravif → rav1e → av1-grain), several minutes of
# build time for a code path that cannot be reached: we only ever encode JPEG
# (see commands/attachments.rs). AVIF *decoding* needs the separate
# `avif-native` feature and was never enabled, so no input format is lost here.
# `exr` is OpenEXR, an HDR film format with no plausible route into a chat app.
image = { version = "0.25", default-features = false, features = [
    "rayon",
    "bmp", "dds", "ff", "gif", "hdr", "ico",
    "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
base64 = "0.22"

# Open files / URLs in the user's default app or browser (0.5.2 file
# presentation): the "open in browser" button and local file links in HTML
# output. Cross-platform, no native deps.
opener = { version = "0.7", features = ["reveal"] }
scraper = "0.20"
pdf-extract = "0.7"

# File search tools (0.9.1): `find_files` matches paths against a glob,
# `search_file_text` matches file contents against a regex. Both pure Rust.
globset = "0.4"
regex = "1.11"

# Live auto re-index (0.4.3): watch knowledge directories and re-embed changed
# files. The debouncer coalesces editor save-bursts into a single re-index.
notify = "6.1"
notify-debouncer-mini = "0.4"

# OCR fallback for vision-incapable models (0.4.0). Pure-Rust engine — no native
# libtesseract — keeping the cross-platform build clean. Needs `.rten` models at
# runtime (see ocr.rs); degrades gracefully when absent.
ocrs = "0.12"
rten = "0.24"

# Speech-to-text (0.8.0). Dictation is transcribed by a user-configured
# provider's OpenAI-compatible `/audio/transcriptions` endpoint (see
# `stt_api.rs`) — the same "provider = base URL + API key" model the rest of the
# app uses, with no embedded model host. On-device transcription is still
# available by pointing that provider at a local server (e.g. LM Studio serving
# a whisper model). `cpal` captures the microphone and `hound` encodes the
# recording as WAV for upload; both are pure-Rust with no native build deps
# (unlike the previously-embedded whisper.cpp, which required libclang + cmake).
cpal = "0.15"
hound = "3.5"

thiserror = "2.0"
tracing-appender = "0.2"

# Browser-impersonating HTTP client for the "smart" web tools (smart_search /
# smart_fetch / smart_crawl). Keyless search engines block reqwest's non-browser
# TLS fingerprint; wreq emulates a real Chrome's JA3/JA4 + HTTP/2 fingerprint so
# the host-driven scraping actually returns results. This is the HTTP layer of
# Hound's approach (which uses Python's `primp`), without a headless browser:
# https://github.com/dondai1234/master-fetch
# NOTE: wreq links BoringSSL — building requires cmake, perl, and NASM (Windows)
# plus a C/C++ compiler, and raised the workspace MSRV to 1.85. Everything else
# in the app stays on reqwest/rustls; wreq is used only by the smart web tools.
wreq = "5.3.0"
wreq-util = "2.2.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
similar = { version = "3.1.2", default-features = false, features = ["text"] }

# Remote access (0.17.0) — a phone as a second window onto this desktop.
# `if-addrs` enumerates the machine's addresses so the LAN bind is a choice
# between real interfaces rather than a blanket `0.0.0.0`; `mdns-sd` advertises
# the desktop so nobody has to type the address that choice produced. `rand`
# generates the six-digit pairing code (already in the tree via several deps;
# this only makes it direct). Token hashing reuses the `sha2` above.
if-addrs = "0.13"
mdns-sd = "0.13"
rand = "0.9"
# `GET /api/events` (0.17.1): a `Stream` written as a loop with `yield`, which
# is what an SSE bridge over a broadcast receiver reads like. The hand-rolled
# alternative is a state machine nobody would want to change.
async-stream = "0.3"

[dev-dependencies]
# Checkpoint tests write real files and restore them — the behaviour under test
# is filesystem behaviour, so a mock of it would prove nothing.
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Release builds default to `incremental = false`, so every `tauri build` used
# to recompile this crate from scratch even for a one-line change. Turning it on
# trades a little runtime performance and disk for a much shorter edit → build
# loop. Deliberately NOT setting `lto`: it shrinks the binary but adds minutes to
# every build, which is the opposite of what we want here.
[profile.release]
incremental = true
