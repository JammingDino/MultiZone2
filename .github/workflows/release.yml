name: Release

# Runs on every push to main, except automated version-bump commits
# (which append "[skip ci]" so GitHub skips this workflow natively).
# A build only proceeds when package.json has "releaseBuild": true.
# After a successful build the bump-version job resets it to false.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Check whether a release build was requested ───────────────────────────
  check:
    name: Check build flag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flag.outputs.should_build }}
      version: ${{ steps.flag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build flag and version
        id: flag
        shell: bash
        run: |
          SHOULD_BUILD=$(node -p "require('./package.json').releaseBuild")
          VERSION=$(node -p "require('./package.json').version")
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releaseBuild=$SHOULD_BUILD  version=$VERSION"

  # ── Build MSI + NSIS installer and publish a GitHub Release ──────────────
  build:
    name: Build & release
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the auto-updater. Without these the build still
          # produces installers, but no signed `latest.json` — and the updater
          # refuses an unsigned manifest, so every existing install silently
          # stops seeing updates. Generated with `tauri signer generate`; the
          # public half is baked into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: MultiZone v${{ needs.check.outputs.version }}
          releaseBody: |
            ## MultiZone v${{ needs.check.outputs.version }}

            | Installer | Description |
            |-----------|-------------|
            | `*_x64_en-US.msi` | Windows MSI installer (recommended) |
            | `*_x64-setup.exe` | NSIS self-contained setup / portable exe |

            Existing installs update themselves — see Settings → Data → Updates.

            See the [commit history](https://github.com/${{ github.repository }}/commits/main)
            for a full list of changes since the last release.
          releaseDraft: false
          prerelease: false
          # `updater` emits the signed bundle + `latest.json` the in-app updater
          # reads. It must ship in the same release as the installers, since the
          # endpoint points at this repo's latest release.
          args: --bundles msi,nsis,updater

  # ── Bump patch version and reset the build flag ──────────────────────────
  bump-version:
    name: Bump patch version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute versions
        id: bump
        shell: bash
        run: |
          OLD=$(node -p "require('./package.json').version")
          NEW=$(node -e "
            const [maj, min, pat] = '$OLD'.split('.').map(Number);
            console.log(maj + '.' + min + '.' + (pat + 1));
          ")
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumping $OLD → $NEW"

      - name: Bump package.json and reset build flag
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.bump.outputs.new }}';
            pkg.releaseBuild = false;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Bump src-tauri/Cargo.toml
        shell: bash
        run: |
          sed -i \
            's/^version = "${{ steps.bump.outputs.old }}"$/version = "${{ steps.bump.outputs.new }}"/' \
            src-tauri/Cargo.toml

      - name: Bump src-tauri/tauri.conf.json
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            cfg.version = '${{ steps.bump.outputs.new }}';
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Commit and push
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} [skip ci]"
          git push origin main
