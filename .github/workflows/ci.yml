name: CI

# Runs on every push and pull request. Deliberately separate from release.yml,
# which only fires when a release was asked for — which meant that between
# releases nothing was verified at all, while 37 files of Rust tests sat in the
# tree with nothing running them.
#
# No app bundle is built here: `cargo build --lib` and the frontend build catch
# the class of breakage this is for (compiles clean, behaves wrong) without
# paying for a full Tauri bundle on every commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, build, script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run build` runs `tsc -b` first, so a type error fails here.
      - name: Build
        run: npm run build

      - name: Script tests
        run: npm test

  rust:
    name: Rust tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # The library alone — no Tauri bundling, no WebView2, no frontend assets
      # needed. wreq links BoringSSL, so cmake/perl/NASM come from the runner
      # image rather than being installed here.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib

      # Advisory: the tree is not currently rustfmt-clean, and reformatting it
      # wholesale would bury real changes in noise for a long time afterwards.
      # Reported so the drift is visible; not enforced until someone decides to
      # do the one-off pass.
      - name: cargo fmt (advisory)
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true
