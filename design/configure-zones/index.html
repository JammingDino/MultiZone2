<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MultiZone — Configure Zones (current state)</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DESIGN TOKENS — copied verbatim from src/styles.css, both palettes.
   --color-accent is set to the magenta the reference screenshot was taken
   with; the shipped default is #4f9cf9. --zone-color is the colour of the
   zone being edited: avatar, selected icon, selected swatch, Save button.
   Change either one and the whole screen re-themes.
   ═══════════════════════════════════════════════════════════════════════ */
:root, [data-theme="dark"] {
  --color-bg: #0b0d10;
  --color-panel: #14171c;
  --color-panel-hover: #242a33;
  --color-border: #2d333d;
  --color-border-strong: #3a4151;
  --color-text: #e4e6eb;
  --color-text-muted: #8b929e;
  --color-accent: #ec4899;
  --color-accent-hover: #f065ab;
  --color-danger: #ef4444;
  --safe-fg: #22c55e;   --safe-bd: rgba(22,163,74,.4);   --safe-bg: rgba(22,163,74,.1);
  --mod-fg:  #eab308;   --mod-bd:  rgba(202,138,4,.4);   --mod-bg:  rgba(202,138,4,.1);
  --dang-fg: #ef4444;   --dang-bd: rgba(220,38,38,.4);   --dang-bg: rgba(220,38,38,.1);
  --amber: #f59e0b;
}
[data-theme="light"] {
  --color-bg: #fafafa;
  --color-panel: #ffffff;
  --color-panel-hover: #e9edf2;
  --color-border: #d8dde4;
  --color-border-strong: #b8bfc9;
  --color-text: #1f2329;
  --color-text-muted: #5b6573;
  --color-accent: #d81b7f;
  --color-accent-hover: #c01670;
  --color-danger: #d63031;
  --safe-fg: #15803d;   --mod-fg: #a16207;   --dang-fg: #b91c1c;
}
:root { --zone-color: #06b6d4; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }
input, textarea, select { font-family: inherit; color: inherit; background: transparent; outline: none; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .92em; }
svg { display: block; }
.ico { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

/* ── Form controls (src/styles.css) ──────────────────────────────────────── */
input[type="checkbox"] {
  appearance: none; width: 16px; height: 16px; min-width: 16px; margin: 0;
  border: 1.5px solid var(--color-border-strong); border-radius: 4px;
  background: var(--color-panel); cursor: pointer; position: relative; flex-shrink: 0;
}
input[type="checkbox"]:hover { border-color: var(--color-accent); }
input[type="checkbox"]:checked { background: var(--color-accent); border-color: var(--color-accent); }
input[type="checkbox"]:checked::after {
  content: ""; position: absolute; left: 4px; top: .5px; width: 5px; height: 9px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg);
}
input[type="checkbox"]:indeterminate { background: var(--color-accent); border-color: var(--color-accent); }
input[type="checkbox"]:indeterminate::after {
  content: ""; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; background: #fff;
}
input[type="range"] {
  appearance: none; width: 100%; height: 4px; padding: 0; cursor: pointer;
  background: var(--color-border); border-radius: 999px;
}
input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--color-border); border-radius: 999px; }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px;
  background: var(--color-accent); border-radius: 50%; border: 2px solid var(--color-bg);
  box-shadow: 0 0 0 1px var(--color-border-strong);
  transition: transform 120ms ease, box-shadow 120ms ease;
}
input[type="range"]:hover::-webkit-slider-thumb {
  transform: scale(1.15); box-shadow: 0 0 0 4px color-mix(in srgb, var(--color-accent) 30%, transparent);
}

/* ── Modal shell (src/components/common/Modal.tsx) ───────────────────────── */
.backdrop {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.6); padding: 24px;
}
.modal {
  display: flex; flex-direction: column;
  width: 980px; height: 700px;               /* ZoneLibrary: h-[700px] w-[980px] */
  max-width: 96vw; max-height: 94vh; overflow: hidden;
  border: 1px solid var(--color-border); border-radius: 12px;
  background: var(--color-panel); box-shadow: 0 25px 50px -12px rgba(0,0,0,.6);
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  height: 56px; flex-shrink: 0; padding: 0 20px;
  border-bottom: 1px solid var(--color-border);
}
.modal-title { margin: 0; font-size: 15px; font-weight: 600; }
.icon-btn {
  flex-shrink: 0; padding: 6px; border-radius: 6px;
  color: var(--color-text-muted); font-size: 16px;
  transition: background-color 130ms ease, color 130ms ease;
}
.icon-btn:hover { background: var(--color-panel-hover); color: var(--color-text); }
.modal-body { display: flex; flex: 1; min-height: 0; }

/* ── Left rail ───────────────────────────────────────────────────────────── */
.rail {
  display: flex; flex-direction: column; width: 224px; flex-shrink: 0;
  border-right: 1px solid var(--color-border);
  background: color-mix(in srgb, var(--color-bg) 40%, transparent);
}
.rail-actions { display: flex; flex-direction: column; gap: 8px; padding: 12px; }
.rail-btn {
  display: flex; align-items: center; justify-content: center;
  height: 36px; border-radius: 8px; font-size: 14px;
  transition: background-color 130ms ease, border-color 130ms ease, color 130ms ease;
}
.rail-btn--new { gap: 6px; font-weight: 500; border: 1px dashed var(--color-border); color: var(--color-accent); }
.rail-btn--new:hover { border-color: var(--color-accent); background: var(--color-panel-hover); }
.rail-btn--library { gap: 8px; font-weight: 600; border: 1px solid var(--color-border); color: var(--color-text-muted); }
.rail-btn--library:hover { border-color: var(--color-accent); }
.rail-label {
  padding: 4px 14px; font-size: 10.5px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted);
}
.rail-list { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.zone-row {
  display: flex; width: 100%; align-items: center; gap: 10px;
  padding: 6px 8px; border-radius: 8px; text-align: left;
  transition: background-color 130ms ease;
}
.zone-row:hover { background: var(--color-panel-hover); }
.zone-row[aria-current="true"] {
  background: var(--color-panel-hover);
  outline: 2px solid var(--color-accent);   /* focus ring, not selection — see README */
  outline-offset: -1px;
}
.zone-avatar {
  display: flex; align-items: center; justify-content: center;
  height: 28px; width: 28px; flex-shrink: 0; border-radius: 8px; color: #fff; font-size: 15px;
}
.zone-meta { min-width: 0; flex: 1; }
.zone-name-row { display: flex; align-items: center; gap: 4px; }
.zone-name { font-size: 13px; font-weight: 500; line-height: 1.25; }
.zone-crown { flex-shrink: 0; font-size: 11px; color: var(--amber); }
.zone-model { display: block; font-size: 11px; color: var(--color-text-muted); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ── Right pane ──────────────────────────────────────────────────────────── */
.pane { position: relative; display: flex; flex-direction: column; flex: 1; min-width: 0; }
.pane-header {
  display: flex; flex-shrink: 0; align-items: center; justify-content: space-between;
  padding: 12px 24px; border-bottom: 1px solid var(--color-border);
}
.back-btn {
  display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px;
  font-size: 12.5px; font-weight: 600; color: var(--color-text-muted);
}
.back-btn:hover { background: var(--color-panel-hover); color: var(--color-text); }
.pane-header-right { display: flex; align-items: center; gap: 10px; }
.pane-title { font-size: 13px; font-weight: 600; }
.default-btn {
  display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border-radius: 8px; border: 1px solid var(--color-border);
  font-size: 12px; font-weight: 500; color: var(--color-text-muted);
}
.default-btn:hover { border-color: var(--color-accent); }

/* ── Zone form (src/components/Zones/ZoneForm.tsx) ───────────────────────── */
.form { flex: 1; overflow-y: auto; padding: 16px; }
.field { display: block; margin-bottom: 12px; }
.field-label { margin-bottom: 4px; font-size: 12px; color: var(--color-text-muted); }
.input {
  width: 100%; padding: 6px 8px; border: 1px solid var(--color-border);
  border-radius: 4px; background: var(--color-panel); font-size: 13px;
}
.input:focus { border-color: var(--color-accent); }
textarea.input { resize: vertical; line-height: 1.5; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
select.input {
  appearance: none; padding-right: 28px;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238b929e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='m6 9 6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 8px center; background-size: 14px 14px;
}

.name-row { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.name-row .field { flex: 1; margin-bottom: 0; }
.avatar-col { display: flex; flex-direction: column; flex-shrink: 0; }
.avatar-spacer { height: 16px; margin-bottom: 4px; }
.avatar-preview {
  display: flex; align-items: center; justify-content: center;
  height: 34px; width: 36px; border-radius: 8px; color: #fff; font-size: 18px;
  box-shadow: 0 1px 2px rgba(0,0,0,.25); background: var(--zone-color);
}

.block { margin-bottom: 16px; }
.block-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 6px; font-size: 12px; color: var(--color-text-muted);
}
.block-action { display: flex; align-items: center; gap: 4px; font-size: 12px; color: inherit; }
.block-action:hover { color: var(--color-text); }
.block-action .ico { font-size: 10px; }

.icon-search { margin-bottom: 8px; font-size: 12px; }
.icon-box { max-height: 176px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 4px; padding: 8px; }
.icon-groups { display: flex; flex-direction: column; gap: 12px; }
.icon-group-label {
  margin-bottom: 4px; font-size: 10px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .05em; color: var(--color-text-muted);
}
.icon-grid { display: grid; grid-template-columns: repeat(10, minmax(0,1fr)); gap: 4px; }
.icon-cell {
  display: flex; align-items: center; justify-content: center;
  padding: 6px; border-radius: 4px; font-size: 14px; transition: background-color 130ms ease;
}
.icon-cell:hover { background: var(--color-panel-hover); }
.icon-cell[aria-pressed="true"] { background: var(--zone-color); color: #fff; }

.swatches { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.swatch {
  height: 24px; width: 24px; border-radius: 9999px;
  outline: 2px solid transparent; outline-offset: 2px; transition: transform 130ms ease;
}
.swatch:hover { transform: scale(1.1); }
.swatch[aria-pressed="true"] { outline-color: currentColor; }
.swatch-custom {
  position: relative; display: flex; align-items: center; justify-content: center;
  height: 24px; width: 32px; overflow: hidden;
  border: 1px solid var(--color-border); border-radius: 4px;
}
.swatch-custom:hover { border-color: var(--color-accent); }
.swatch-custom span { font-size: 9px; font-family: ui-monospace, Menlo, monospace; color: var(--color-text-muted); }

.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* Templates dropdown */
.tpl-wrap { position: relative; }
.tpl-btn {
  display: flex; align-items: center; gap: 4px; padding: 2px 6px;
  border: 1px solid var(--color-border); border-radius: 4px; font-size: 12px;
}
.tpl-btn:hover { border-color: var(--color-accent); color: var(--color-text); }
.tpl-menu {
  position: absolute; right: 0; top: 100%; z-index: 40; margin-top: 4px; width: 288px;
  border: 1px solid var(--color-border); border-radius: 6px;
  background: var(--color-panel); padding: 4px 0; box-shadow: 0 20px 25px -5px rgba(0,0,0,.5);
}
.tpl-menu[hidden] { display: none; }
.tpl-menu-label {
  padding: 6px 12px; font-size: 10px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--color-text-muted);
}
.tpl-list { max-height: 256px; overflow-y: auto; }
.tpl-item {
  display: flex; width: 100%; flex-direction: column; align-items: flex-start;
  padding: 8px 12px; text-align: left;
}
.tpl-item:hover { background: var(--color-panel-hover); }
.tpl-item b { font-size: 12px; font-weight: 500; color: var(--color-text); }
.tpl-item i { margin-top: 2px; font-size: 11px; font-style: normal; color: var(--color-text-muted); }
.tpl-item u { margin-top: 4px; font-size: 10px; text-decoration: none; color: var(--color-text-muted); opacity: .7; }

/* Tools */
.tool-stack { display: flex; flex-direction: column; gap: 6px; }
.group-toggle {
  display: flex; cursor: pointer; user-select: none; align-items: center; gap: 8px;
  border-radius: 4px; padding: 4px 2px;
  font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em;
  color: var(--color-text-muted);
}
.group-toggle:hover { color: var(--color-text); }
.group-toggle--emphasis { color: var(--color-text); }
.tools-master { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--color-border); padding-bottom: 6px; }
.reset-usage { margin-left: auto; font-size: 10px; color: var(--color-text-muted); text-decoration: underline; }
.reset-usage:hover { color: var(--color-accent); }
.tool-group { margin-top: 4px; }
.tool-list { margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
.tool-card {
  border: 1px solid var(--color-border); border-radius: 4px;
  background: var(--color-bg); font-size: 12px;
}
.tool-main { display: flex; cursor: pointer; align-items: flex-start; gap: 8px; padding: 8px; }
.tool-main:hover { border-color: var(--color-accent); }
.tool-main > input { margin-top: 2px; }
.tool-body { flex: 1; min-width: 0; }
.tool-title-row { display: flex; align-items: center; gap: 6px; }
.tool-title { font-weight: 500; }
.badge { border: 1px solid; border-radius: 4px; padding: 2px 6px; font-size: 10px; font-weight: 500; }
.badge--0 { color: var(--safe-fg); border-color: var(--safe-bd); background: var(--safe-bg); }
.badge--1 { color: var(--mod-fg);  border-color: var(--mod-bd);  background: var(--mod-bg); }
.badge--2 { color: var(--dang-fg); border-color: var(--dang-bd); background: var(--dang-bg); }
.badge--custom {
  color: var(--color-accent);
  border-color: color-mix(in srgb, var(--color-accent) 40%, transparent);
  background: color-mix(in srgb, var(--color-accent) 10%, transparent);
}
.tool-usage { margin-left: auto; flex-shrink: 0; font-size: 10px; color: var(--color-text-muted); }
.tool-usage .fail { color: var(--color-danger); }
.tool-desc { margin-top: 2px; color: var(--color-text-muted); }

.tool-fns { border-top: 1px solid var(--color-border); }
.tool-fns-toggle {
  display: flex; width: 100%; align-items: center; gap: 4px;
  padding: 4px 8px; font-size: 10px; color: var(--color-text-muted);
}
.tool-fns-toggle:hover { color: var(--color-accent); }
.tool-fns-toggle .ico { font-size: 10px; transition: transform 130ms ease; transform: rotate(-90deg); }
.tool-fns-toggle[aria-expanded="true"] .ico { transform: none; }
.tool-fns-body { display: flex; flex-direction: column; gap: 8px; padding: 0 8px 8px; }
.tool-fns-body[hidden] { display: none; }
.fn-head { margin-bottom: 2px; display: flex; align-items: center; gap: 6px; }
.fn-name { font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
.fn-reset { font-size: 10px; color: var(--color-text-muted); text-decoration: underline; }
.fn-reset:hover { color: var(--color-accent); }
.fn-textarea { font-family: ui-monospace, Menlo, monospace; font-size: 10px; line-height: 1.625; }
.fn-note { font-size: 10px; color: var(--color-text-muted); margin: 0; }

/* Boxed checkbox rows (Code exec / Reasoning / Multizone) */
.opt-box {
  display: flex; cursor: pointer; align-items: flex-start; gap: 8px;
  border: 1px solid var(--color-border); border-radius: 4px;
  background: var(--color-bg); padding: 8px; font-size: 12px;
}
.opt-box:hover { border-color: var(--color-accent); }
.opt-box > input { margin-top: 2px; }
.opt-title { font-weight: 500; }
.opt-desc { color: var(--color-text-muted); }
.opt-desc code { background: var(--color-panel-hover); border-radius: 3px; padding: 0 3px; }
.settings-box {
  margin-bottom: 12px; border: 1px solid var(--color-border); border-radius: 4px;
  background: var(--color-bg); padding: 12px;
}
.settings-box .opt-box { background: var(--color-panel); }
.settings-title { margin-bottom: 8px; font-size: 12px; font-weight: 500; color: var(--color-text); }
.hint { margin: 4px 0 0; font-size: 11px; color: var(--color-text-muted); }

.form-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 12px 16px; border-top: 1px solid var(--color-border);
}
.btn-delete {
  display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 4px;
  font-size: 12px; border: 1px solid var(--color-danger); color: var(--color-danger);
}
.btn-delete:hover { background: var(--color-danger); color: #fff; }
.btn-save { padding: 6px 12px; border-radius: 4px; font-size: 12px; color: #fff; background: var(--zone-color); }

/* Review affordances — NOT part of the app. */
.devbar {
  position: fixed; top: 12px; right: 12px; z-index: 60; display: flex; gap: 6px;
}
.devbar button {
  padding: 6px 12px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--color-border); background: var(--color-panel); color: var(--color-text-muted);
}
.devbar button:hover { color: var(--color-text); border-color: var(--color-accent); }
</style>
</head>
<body>

<div class="devbar">
  <button id="theme-switch" type="button">Light / dark</button>
  <button id="expand-all" type="button">Expand all tools</button>
</div>

<div class="backdrop">
  <div class="modal" role="dialog" aria-label="Configure Zones">

    <div class="modal-header">
      <h2 class="modal-title">Configure Zones</h2>
      <button class="icon-btn" aria-label="Close"><svg class="ico"><use href="#i-X"/></svg></button>
    </div>

    <div class="modal-body">

      <!-- ══ LEFT RAIL ════════════════════════════════════════════════════ -->
      <aside class="rail">
        <div class="rail-actions">
          <button class="rail-btn rail-btn--new">
            <svg class="ico" style="font-size:15px"><use href="#i-Plus"/></svg> New Zone
          </button>
          <button class="rail-btn rail-btn--library">
            <svg class="ico" style="font-size:15px"><use href="#i-Sparkles"/></svg> Browse Library
          </button>
        </div>
        <div class="rail-label">Installed · 9</div>
        <div class="rail-list" id="zone-list"></div>
      </aside>

      <!-- ══ RIGHT PANE — the zone editor ═════════════════════════════════ -->
      <section class="pane">

        <div class="pane-header">
          <button class="back-btn">
            <svg class="ico" style="font-size:15px"><use href="#i-ChevronLeft"/></svg> Zone Library
          </button>
          <div class="pane-header-right">
            <span class="pane-title">Edit zone</span>
            <button class="default-btn" title="Make this the default zone for new chats">
              <svg class="ico" style="font-size:13px"><use href="#i-Star"/></svg> Make default
            </button>
          </div>
        </div>

        <div class="form">

          <!-- ── 1. Name + live avatar preview ──────────────────────────── -->
          <div class="name-row">
            <label class="field">
              <div class="field-label">Name</div>
              <input class="input" value="Deepseek" />
            </label>
            <div class="avatar-col">
              <div class="avatar-spacer"></div>
              <div class="avatar-preview" id="avatar-preview"><svg class="ico"><use href="#i-Globe"/></svg></div>
            </div>
          </div>

          <!-- ── 2. Icon picker ─────────────────────────────────────────── -->
          <div class="block">
            <div class="block-head">
              <span>Icon</span>
              <button class="block-action"><svg class="ico"><use href="#i-X"/></svg> Clear</button>
            </div>
            <input class="input icon-search" placeholder="Search icons…" />
            <div class="icon-box"><div class="icon-groups" id="icon-groups"></div></div>
          </div>

          <!-- ── 3. Zone colour ─────────────────────────────────────────── -->
          <div class="block">
            <div class="block-head">
              <span>Zone color</span>
              <button class="block-action"><svg class="ico"><use href="#i-X"/></svg> Use global accent</button>
            </div>
            <div class="swatches" id="swatches">
              <div class="swatch-custom" title="Custom color"><span id="hex-chip">06B</span></div>
            </div>
          </div>

/* src/lib/types.ts — TOOL_CATEGORIES + ALL_TOOLS, verbatim. `hidden: true`
   tools never appear in the picker. `fns` is the set of function names each
   group exposes to the model (src-tauri/src/tools/mod.rs → ToolId::definitions),
   with the built-in description each one ships with — that is the placeholder
   text in the "What the model is told" editor. */
const TOOL_CATEGORIES = ["Files", "Web", "Knowledge", "Agents", "System"];

const ALL_TOOLS = [
  // ── Files

/* Tools connected via MCP servers appear after the built-in categories, one
   group per server, each tool carrying its user-assigned danger badge. */
const MCP_SERVERS = [
  { name: "tavily", tools: [
    { name: "tavily_search", danger: 1, desc: "Paid web search with a Tavily API key — an alternative to the built-in keyless search." },
    { name: "tavily_extract", danger: 1, desc: "Extract the readable content of a URL via Tavily." },
  ]},
];

/* Per-zone state shown in this replica. */
const ENABLED = new Set(["smart_search","smart_fetch","present_file","render_graph","date_time","plan","memory","skills"]);
const USAGE   = { smart_search: { calls: 42, errors: 2 }, render_graph: { calls: 7, errors: 0 },
                  present_file: { calls: 3, errors: 0 }, smart_fetch: { calls: 18, errors: 1 } };
const CUSTOMIZED = { smart_search: 1 };   /* count of fns with a description override */

const SAFETY = { 0: "Safe", 1: "Moderate", 2: "Dangerous" };
const SELECTED_ICON = "Globe";
const SELECTED_COLOR = "#06b6d4";

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════════════ */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]));
const icon = (name, size) =>
  `<svg class="ico"${size ? ` style="font-size:${size}px"` : ""}><use href="#i-${name}"/></svg>`;

// ── Left rail
$("#zone-list").innerHTML = ZONES.map((z) => `
  <button class="zone-row"${z.active ? ' aria-current="true"' : ""}>
    <span class="zone-avatar" style="background:${z.color}">${icon(z.icon)}</span>
    <span class="zone-meta">
      <span class="zone-name-row">
        <span class="zone-name trunc">${esc(z.name)}</span>
        ${z.leader ? `<span class="zone-crown">${icon("Crown")}</span>` : ""}
      </span>
      <span class="zone-model trunc">${esc(z.model)}</span>
    </span>
  </button>`).join("");

// ── Icon picker
$("#icon-groups").innerHTML = ICON_GROUPS.map((g) => `
  <div>
    <div class="icon-group-label">${esc(g.label)}</div>
    <div class="icon-grid">
      ${g.icons.map((n) => `
        <button class="icon-cell" data-icon="${n}" title="${n}"
                ${n === SELECTED_ICON ? 'aria-pressed="true"' : ""}>${icon(n)}</button>`).join("")}
    </div>
  </div>`).join("");

// ── Colour swatches
$("#swatches").insertAdjacentHTML("afterbegin", COLORS.map((c) => `
  <button class="swatch" data-color="${c}" title="${c}" style="background:${c};color:${c}"
          ${c === SELECTED_COLOR ? 'aria-pressed="true"' : ""}></button>`).join(""));

// ── Prompt templates
$("#tpl-list").innerHTML = TEMPLATES.map((t) => `
  <button type="button" class="tpl-item">
    <b>${esc(t.label)}</b>
    <i>${esc(t.desc)}</i>
    ${t.tools ? `<u>Enables: ${esc(t.tools.join(", "))}</u>` : ""}
  </button>`).join("");

// ── Tools
function usageLabel(id) {
  if (!ENABLED.has(id)) return "";
  const u = USAGE[id];
  if (!u || u.calls === 0)
    return `<span class="tool-usage" title="This zone has never called this tool. It still costs context on every turn.">never used</span>`;
  return `<span class="tool-usage" title="Called ${u.calls}×${u.errors ? `, ${u.errors} failed` : ""}">${u.calls}× used${
    u.errors ? `<span class="fail"> · ${u.errors} failed</span>` : ""}</span>`;
}

function toolCard(t) {
  const on = ENABLED.has(t.id);
  const fns = Object.entries(t.fns);
  const custom = CUSTOMIZED[t.id] ?? 0;
  return `
  <div class="tool-card" data-tool="${t.id}">
    <label class="tool-main">
      <input type="checkbox" class="tool-check" data-tool="${t.id}" ${on ? "checked" : ""} />
      <div class="tool-body">
        <div class="tool-title-row">
          <span class="tool-title">${esc(t.label)}</span>
          <span class="badge badge--${t.safety}">${SAFETY[t.safety]}</span>
          ${custom ? `<span class="badge badge--custom">${custom} custom</span>` : ""}
          ${usageLabel(t.id)}
        </div>
        <div class="tool-desc">${esc(t.desc)}</div>
      </div>
    </label>
    <div class="tool-fns"${on ? "" : " hidden"}>
      <button type="button" class="tool-fns-toggle" aria-expanded="false">
        ${icon("ChevronDown", 10)} What the model is told (${fns.length})
      </button>
      <div class="tool-fns-body" hidden>
        ${fns.map(([name, desc]) => `
          <div>
            <div class="fn-head">
              <span class="fn-name">${name}</span>
              ${custom ? `<button type="button" class="fn-reset">reset</button>` : ""}
            </div>
            <textarea class="input fn-textarea" rows="3" placeholder="${esc(desc)}"></textarea>
          </div>`).join("")}
        <p class="fn-note">
          Leave a box empty to use the built-in description shown as placeholder text. This is what
          the model reads to decide when and how to call the tool — rewriting it is the most direct
          way to fix a model that ignores a tool or uses it wrongly.
        </p>
      </div>
    </div>
  </div>`;
}

$("#tool-categories").innerHTML = TOOL_CATEGORIES.map((cat) => {
  const inCat = ALL_TOOLS.filter((t) => t.cat === cat && !t.hidden);
  if (!inCat.length) return "";
  return `
  <div class="tool-group" data-category="${cat}">
    <label class="group-toggle"><input type="checkbox" class="group-check" /> ${cat}</label>
    <div class="tool-list">${inCat.map(toolCard).join("")}</div>
  </div>`;
}).join("");

$("#mcp-groups").innerHTML = MCP_SERVERS.map((s) => `
  <div class="tool-group">
    <label class="group-toggle"><input type="checkbox" class="group-check" /> MCP · ${esc(s.name)}</label>
    <div class="tool-list">
      ${s.tools.map((t) => `
        <label class="tool-main tool-card" style="border-radius:4px">
          <input type="checkbox" />
          <div class="tool-body">
            <div class="tool-title-row">
              <span class="fn-name" style="font-size:12px;font-weight:500">${esc(t.name)}</span>
              <span class="badge badge--${t.danger}">${SAFETY[t.danger]}</span>
            </div>
            <div class="tool-desc">${esc(t.desc)}</div>
          </div>
        </label>`).join("")}
    </div>
  </div>`).join("");

/* ═══════════════════════════════════════════════════════════════════════════
   INTERACTION — enough for the screen to be explored, not a working editor.
   ═══════════════════════════════════════════════════════════════════════ */

// Group / master checkbox tri-state, mirroring GroupToggle.
function syncGroups() {
  document.querySelectorAll(".tool-group[data-category]").forEach((g) => {
    const boxes = [...g.querySelectorAll(".tool-check")];
    const on = boxes.filter((b) => b.checked).length;
    const gb = g.querySelector(".group-check");
    gb.checked = on === boxes.length && on > 0;
    gb.indeterminate = on > 0 && on < boxes.length;
  });
  const all = [...document.querySelectorAll(".tool-check")];
  const on = all.filter((b) => b.checked).length;
  const master = $("#all-tools");
  master.checked = on === all.length;
  master.indeterminate = on > 0 && on < all.length;
  // Code Execution settings only appear when "Run code" is on.
  $("#code-exec-settings").hidden = !document.querySelector('.tool-check[data-tool="code_exec"]').checked;
}

document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.classList.contains("tool-check")) {
    // A tool's description editor is only offered while it is enabled.
    t.closest(".tool-card").querySelector(".tool-fns").hidden = !t.checked;
    syncGroups();
  } else if (t.classList.contains("group-check")) {
    const boxes = [...t.closest(".tool-group").querySelectorAll(".tool-check")];
    boxes.forEach((b) => {
      b.checked = t.checked;
      const fns = b.closest(".tool-card")?.querySelector(".tool-fns");
      if (fns) fns.hidden = !t.checked;
    });
    syncGroups();
  } else if (t.id === "all-tools") {
    document.querySelectorAll(".tool-check").forEach((b) => {
      b.checked = t.checked;
      b.closest(".tool-card").querySelector(".tool-fns").hidden = !t.checked;
    });
    syncGroups();
  }
});

document.addEventListener("click", (e) => {
  const fnsToggle = e.target.closest(".tool-fns-toggle");
  if (fnsToggle) {
    const open = fnsToggle.getAttribute("aria-expanded") === "true";
    fnsToggle.setAttribute("aria-expanded", String(!open));
    fnsToggle.nextElementSibling.hidden = open;
    return;
  }
  const iconCell = e.target.closest(".icon-cell");
  if (iconCell) {
    document.querySelectorAll(".icon-cell").forEach((c) => c.removeAttribute("aria-pressed"));
    iconCell.setAttribute("aria-pressed", "true");
    $("#avatar-preview").innerHTML = icon(iconCell.dataset.icon);
    return;
  }
  const swatch = e.target.closest(".swatch");
  if (swatch) {
    document.querySelectorAll(".swatch").forEach((s) => s.removeAttribute("aria-pressed"));
    swatch.setAttribute("aria-pressed", "true");
    const c = swatch.dataset.color;
    document.documentElement.style.setProperty("--zone-color", c);
    $("#hex-chip").textContent = c.slice(1, 4).toUpperCase();
    return;
  }
  // Templates dropdown, with the app's click-outside-to-close backdrop.
  const menu = $("#tpl-menu"), btn = $("#tpl-btn");
  if (e.target.closest("#tpl-btn")) {
    const open = menu.hidden;
    menu.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
  } else if (!e.target.closest("#tpl-menu")) {
    menu.hidden = true;
    btn.setAttribute("aria-expanded", "false");
  }
});

$("#temp").addEventListener("input", (e) => {
  $("#temp-label").textContent = `Temperature: ${Number(e.target.value).toFixed(2)}`;
});

$("#theme-switch").addEventListener("click", () => {
  const r = document.documentElement;
  r.dataset.theme = r.dataset.theme === "dark" ? "light" : "dark";
});

$("#expand-all").addEventListener("click", () => {
  const anyClosed = [...document.querySelectorAll(".tool-fns-toggle")]
    .some((b) => b.getAttribute("aria-expanded") !== "true");
  document.querySelectorAll(".tool-fns-toggle").forEach((b) => {
    b.setAttribute("aria-expanded", String(anyClosed));
    b.nextElementSibling.hidden = !anyClosed;
  });
});

syncGroups();
</script>
</body>
</html>
