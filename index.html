<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- The app icon, for a browser tab (browser mode, 0.21) and a phone's home
         screen; the window takes its icon from tauri.conf instead. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- `viewport-fit=cover` so the app reaches under a phone's notch and home
         indicator; the safe-area insets in styles.css keep content out of them.
         Zoom is disabled because a double-tap on a chat bubble should select a
         word, not scale the whole interface. `resizes-content` (0.21): the
         on-screen keyboard shrinks the page rather than sliding over it, so
         the composer sits on top of the keyboard instead of under it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MultiZone</title>
    <!-- The window is created transparent (for the opt-in see-through window),
         so until the stylesheet arrives something has to paint it solid — or
         every launch would open as a see-through frame. The backdrop gradient
         too (cached with the palette, below), so the boot splash, which is drawn
         on the backdrop, never starts on a plain colour; it lies under the
         stylesheet's own backdrop layer afterwards. It mirrors that layer
         (body::before in styles.css): the same --mz-glow, and with the drift on,
         the same 130% size, so nothing moves when the real one takes over. -->
    <style>
      html:not(.see-through) { background-color: var(--color-bg, #0b0d10); }
      html.light:not(.see-through) { background-color: var(--color-bg, #fafafa); }
      :root { --mz-glow: 60%; }
      html.light { --mz-glow: 55%; }
      html:not(.see-through) { background-image: var(--mz-backdrop, none); background-attachment: fixed; }
      html.backdrop-motion { background-size: 130% 130%; background-position: center; }
    </style>
    <script>
      /*
       * Put back the appearance this install was last using, before the first
       * paint.
       *
       * The real preferences live in the database, which means the window has
       * already painted by the time the store has read them: a light-mode user
       * saw a dark panel flash on every launch, and anyone who had changed the
       * interface font size saw the whole UI resize a moment after it appeared.
       *
       * Nothing here decides anything. `applyThemeToDom` / `applyAppSettingsToDom`
       * in store/app.ts write every one of their decisions as inline style and
       * classes on <html>, and cache that element's `style` + `class` verbatim
       * (see `saveBootSnapshot`) — so this is a replay of the last frame the app
       * settled on, which the store then overwrites with the authoritative values
       * a few hundred milliseconds later. A stale or missing snapshot is only ever
       * the flash we had before.
       */
      try {
        var mzBoot = JSON.parse(localStorage.getItem("mz.boot.v1") || "null");
        if (mzBoot) {
          var mzHtml = document.documentElement;
          if (mzBoot.cls) mzHtml.className = mzBoot.cls;
          if (mzBoot.style) mzHtml.setAttribute("style", mzBoot.style);
          /* The webfont too — it is a network fetch, so starting it here rather
             than after the store loads is the difference between the first text
             the user sees being their font and being Inter. */
          if (mzBoot.fontHref) {
            var mzLink = document.createElement("link");
            mzLink.id = "mz-font-link";
            mzLink.rel = "stylesheet";
            mzLink.href = mzBoot.fontHref;
            document.head.appendChild(mzLink);
          }
        }
      } catch (e) {
        /* Storage disabled or corrupt — the app starts on its defaults, exactly
           as it did before any of this existed. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
