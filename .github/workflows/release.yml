name: Release

# Runs on every push to main, except automated version-bump commits
# (which append "[skip ci]" so GitHub skips this workflow natively).
# A build only proceeds when package.json has "releaseBuild": true.
# After a successful build the bump-version job resets it to false.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Check whether a release build was requested ───────────────────────────
  check:
    name: Check build flag
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.flag.outputs.should_build }}
      version: ${{ steps.flag.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read build flag and version
        id: flag
        shell: bash
        run: |
          SHOULD_BUILD=$(node -p "require('./package.json').releaseBuild")
          VERSION=$(node -p "require('./package.json').version")
          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releaseBuild=$SHOULD_BUILD  version=$VERSION"

  # ── Build MSI + NSIS installer and publish a GitHub Release ──────────────
  build:
    name: Build & release
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Kept in step with ci.yml. A release built on a different Node major than
      # the one CI verifies is a gap you only find out about in a published
      # build.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for the auto-updater. Without these the build still
          # produces installers, but no signed `latest.json` — and the updater
          # refuses an unsigned manifest, so every existing install silently
          # stops seeing updates. Generated with `tauri signer generate`; the
          # public half is baked into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Read-only token the shipped app authenticates its update checks
          # with, since a private repo serves neither the manifest nor the
          # installers anonymously. `build.rs` bakes it into the binary; it is
          # never written to the working tree. Deliberately NOT the workflow's
          # GITHUB_TOKEN, which expires when the job ends.
          MULTIZONE_UPDATER_TOKEN: ${{ secrets.UPDATER_READ_TOKEN }}
        with:
          tagName: v${{ needs.check.outputs.version }}
          releaseName: MultiZone v${{ needs.check.outputs.version }}
          releaseBody: |
            ## MultiZone v${{ needs.check.outputs.version }}

            | Installer | Description |
            |-----------|-------------|
            | `*_x64-setup.exe` | Windows installer |
            | `MultiZone-*.apk` | Android — a remote for your computer, not a second app. Pair it under Settings → Phone & remote. |

            Existing installs update themselves — see Settings → Data → Updates.

            See the [commit history](https://github.com/${{ github.repository }}/commits/main)
            for a full list of changes since the last release.
          releaseDraft: false
          prerelease: false
          # `updater` emits the signed bundle + `latest.json` the in-app updater
          # reads; the `bump-version` job rewrites that manifest for private
          # access and commits it.
          #
          # NSIS only, no MSI. Shipping both installed the same app twice into
          # the same directory, and the MSI's Start Menu shortcut takes its icon
          # from `C:\Windows\Installer\{ProductCode}\ProductIcon`. WiX mints a
          # new ProductCode per version, so each upgrade deleted the folder the
          # existing shortcut pointed at and the icon fell back to the generic
          # one. NSIS shortcuts reference the exe itself, which cannot go stale.
          args: --bundles nsis,updater

  # ── Build the Android APK and attach it to the same release ─────────────
  #
  # A separate job, on Linux, for one concrete reason: `tauri android build`
  # symlinks the built `.so` into `jniLibs`, and Windows refuses symlinks unless
  # Developer Mode is on. Rather than depend on a runner image's system
  # settings, the Android build runs where symlinks are ordinary. It is also
  # genuinely independent work — nothing in the APK comes from the Windows job —
  # so running it in parallel costs nothing but the runner.
  #
  # It waits for `build` only because it uploads into the release that job
  # creates.
  #
  # **Signing.** A release APK Android will install has to be signed. If the
  # keystore secrets are absent the job stops with an explanation instead of
  # failing the release: publishing a Windows installer is the pipeline's job,
  # and an Android build that cannot sign must not take that down with it. To
  # turn it on, set:
  #
  #   ANDROID_KEYSTORE_BASE64      base64 of a .jks/.keystore file
  #   ANDROID_KEYSTORE_PASSWORD
  #   ANDROID_KEY_ALIAS
  #   ANDROID_KEY_PASSWORD
  #
  # Keep that keystore. Android identifies an app by its signature, so a
  # replacement key means every existing install must be uninstalled before it
  # can take an update.
  android:
    name: Build Android APK
    needs: [check, build]
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for signing keys
        id: keys
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — skipping the Android build. The Windows release is unaffected."
          fi

      - name: Setup Node 22
        if: steps.keys.outputs.signed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        if: steps.keys.outputs.signed == 'true'
        run: npm ci

      - name: Setup Java 17
        if: steps.keys.outputs.signed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        if: steps.keys.outputs.signed == 'true'
        uses: android-actions/setup-android@v3

      - name: Install the NDK
        if: steps.keys.outputs.signed == 'true'
        run: |
          sdkmanager --install "ndk;27.1.12297006"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # Only the two architectures a phone actually is. Every extra target is a
      # full compile of the crate for an ABI nobody will install — x86 Android
      # is emulators, and the emulator can run a debug build.
      - name: Setup Rust with Android targets
        if: steps.keys.outputs.signed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Rust build cache
        if: steps.keys.outputs.signed == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      # The generated project is committed, so this is a guard rather than a
      # step that normally does anything: it fails the build if the app's icons
      # are not the ones the APK would ship.
      - name: Verify the launcher icons
        if: steps.keys.outputs.signed == 'true'
        run: node scripts/sync-android-icons.mjs --check

      - name: Write the keystore
        if: steps.keys.outputs.signed == 'true'
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Gradle reads this file; it is written outside the working tree and
          # the runner is discarded, so neither the key nor its password can end
          # up in a commit.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          EOF

      - name: Build the APK
        if: steps.keys.outputs.signed == 'true'
        env:
          MULTIZONE_UPDATER_TOKEN: ${{ secrets.UPDATER_READ_TOKEN }}
        run: npx tauri android build --apk --target aarch64 armv7

      - name: Attach the APK to the release
        if: steps.keys.outputs.signed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::the Android build produced no release APK"
            exit 1
          fi
          cp "$APK" "MultiZone-$VERSION.apk"
          gh release upload "v$VERSION" "MultiZone-$VERSION.apk" --clobber

  # ── Bump patch version and reset the build flag ──────────────────────────
  bump-version:
    name: Bump patch version
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # One script, not four inlined `node -e` blocks. The blocks updated
      # package.json, Cargo.toml and tauri.conf.json and silently skipped
      # Cargo.lock, so main shipped two releases with Cargo.toml and Cargo.lock
      # disagreeing — invisible in an ordinary build, fatal under `--locked`.
      # scripts/bump-version-core.mjs owns the list and has tests, including one
      # that fails if the four files in this repo ever drift apart again.
      - name: Compute and apply the version bump
        id: bump
        shell: bash
        run: |
          OLD=$(node -p "require('./package.json').version")
          NEW=$(node scripts/bump-version.mjs)
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "Bumped $OLD -> $NEW"

      # Point the manifest's download URLs at token-authenticated asset
      # endpoints and commit it to the path the updater polls. Runs in this job
      # rather than its own so the manifest and the version bump land in one
      # commit — two jobs pushing to main would race.
      - name: Rewrite updater manifest for private access
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.bump.outputs.old }}
        run: node scripts/rewrite-updater-manifest.mjs

      - name: Commit and push
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json updater/latest.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new }} [skip ci]"
          git push origin main
